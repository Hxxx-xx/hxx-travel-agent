# 生产环境配置
spring:
  config:
    activate:
      on-profile: prod

  # 生产环境数据源配置（使用Druid连接池）- 从环境变量读取
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hxx_travel_agent}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&requireSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      # 连接池配置
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 50
      filters: stat,wall
      # 慢SQL记录
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=3000
      # 生产环境关闭Web监控
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false

  # 生产环境Redis配置 - 从环境变量读取
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# Redis缓存配置
redis:
  key-prefix: hxx_travel_prod
  default-ttl-seconds: 3600
  weather-ttl-seconds: 3600
  map-ttl-seconds: 86400
  rag-ttl-seconds: 43200

# 服务端口
server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

# 生产环境高德地图配置
amap:
  api-key: ${AMAP_API_KEY:}
  enrichment-enabled: ${AMAP_ENRICHMENT_ENABLED:false}

# 生产环境日志
logging:
  level:
    root: WARN
    com.hxx.travel.agent: INFO
  file:
    name: /var/log/hxx-travel-agent/application.log
    max-size: 100MB
    max-history: 30
