# ============================================
# 生产环境配置
# ============================================
spring:
  config:
    activate:
      on-profile: prod

  # 生产环境数据源（使用 Druid 连接池）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:hxx_travel_agent}?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai&requireSSL=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    druid:
      initial-size: 10
      min-idle: 10
      max-active: 50
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 50
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=3000
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false

  # 生产环境 Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      timeout: 5s
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 3000ms

# ============================================
# MyBatis-Plus 生产环境配置
# ============================================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nolog.NoLoggingImpl

# ============================================
# 生产环境 LLM 配置
# ============================================
llm:
  api-key: ${LLM_API_KEY:}
  base-url: ${LLM_BASE_URL:}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: ${LLM_TIMEOUT:120}

# ============================================
# 生产环境高德地图配置
# ============================================
amap:
  api-key: ${AMAP_API_KEY:}
  base-url: https://restapi.amap.com/v3
  default-city: ${AMAP_DEFAULT_CITY:}
  timeout-seconds: ${AMAP_TIMEOUT:20}
  enrichment-enabled: ${AMAP_ENRICHMENT_ENABLED:false}

# ============================================
# 生产环境 RAG 配置
# ============================================
rag:
  data-dir: ${RAG_DATA_DIR:/data}
  top-k: ${RAG_TOP_K:5}
  cache-ttl-seconds: ${RAG_CACHE_TTL:43200}

# ============================================
# 生产环境 Qdrant 配置
# ============================================
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection-name: ${QDRANT_COLLECTION:travel_guides}

# ============================================
# Redis 缓存配置（生产环境）
# ============================================
redis:
  key-prefix: hxx_travel_prod
  default-ttl-seconds: ${REDIS_DEFAULT_TTL:3600}
  weather-ttl-seconds: ${REDIS_WEATHER_TTL:3600}
  map-ttl-seconds: ${REDIS_MAP_TTL:86400}
  rag-ttl-seconds: ${REDIS_RAG_TTL:43200}

# ============================================
# Sa-Token 配置（预留）
# ============================================
sa-token:
  enabled: ${SA_TOKEN_ENABLED:false}

# ============================================
# 服务端口
# ============================================
server:
  port: ${SERVER_PORT:9000}
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 10

# ============================================
# 生产环境日志级别
# ============================================
logging:
  level:
    root: WARN
    com.hxx.travel.agent: INFO
  file:
    name: ${LOG_PATH:/var/log/hxx-travel-agent}/application.log
    max-size: 100MB
    max-history: 30
