# 测试环境配置
spring:
  config:
    activate:
      on-profile: test

  # 测试环境数据源配置（使用Druid连接池 - 连接MySQL测试库）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hxx_travel_agent_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 10
      validation-query: SELECT 1
      test-while-idle: true

  # 测试环境Redis配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

# Redis缓存配置
redis:
  key-prefix: hxx_travel_test
  default-ttl-seconds: 300
  weather-ttl-seconds: 300
  map-ttl-seconds: 3600
  rag-ttl-seconds: 3600

# 服务端口
server:
  port: 8081

# 测试环境日志
logging:
  level:
    root: INFO
    com.hxx.travel.agent: DEBUG
    com.hxx.travel.agent.service: TRACE

# 测试环境LLM配置
llm:
  api-key: test-api-key
  model: gpt-4o-mini

# 测试环境高德地图配置
amap:
  api-key: test-amap-key
  enrichment-enabled: false
