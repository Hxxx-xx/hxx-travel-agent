# ============================================
# 测试环境配置
# ============================================
spring:
  config:
    activate:
      on-profile: test

  # 测试环境数据源（使用 Druid 连接池）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hxx_travel_agent_test?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 10
      validation-query: SELECT 1
      test-while-idle: true

  # 测试环境 Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      database: 1

# ============================================
# MyBatis-Plus 测试环境配置
# ============================================
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ============================================
# 测试环境 LLM 配置
# ============================================
llm:
  api-key: test-api-key
  base-url: ${LLM_BASE_URL:http://localhost:11434}
  model: ${LLM_MODEL:gpt-4o-mini}
  timeout-seconds: 30

# ============================================
# 测试环境高德地图配置
# ============================================
amap:
  api-key: test-amap-key
  base-url: https://restapi.amap.com/v3
  default-city: ${AMAP_DEFAULT_CITY:}
  timeout-seconds: 10
  enrichment-enabled: false

# ============================================
# 测试环境 RAG 配置
# ============================================
rag:
  data-dir: ${RAG_DATA_DIR:src/test/data}
  top-k: 3
  cache-ttl-seconds: 3600

# ============================================
# 测试环境 Qdrant 配置
# ============================================
qdrant:
  host: ${QDRANT_HOST:localhost}
  port: ${QDRANT_PORT:6333}
  collection-name: ${QDRANT_COLLECTION:travel_guides}

# ============================================
# Redis 缓存配置（测试环境）
# ============================================
redis:
  key-prefix: hxx_travel_test
  default-ttl-seconds: 300
  weather-ttl-seconds: 300
  map-ttl-seconds: 3600
  rag-ttl-seconds: 3600

# ============================================
# Sa-Token 配置（预留）
# ============================================
sa-token:
  enabled: false

# ============================================
# 服务端口
# ============================================
server:
  port: 2000

# ============================================
# 测试环境日志级别
# ============================================
logging:
  level:
    root: INFO
    com.hxx.travel.agent: DEBUG
    com.hxx.travel.agent.trip.service: TRACE
