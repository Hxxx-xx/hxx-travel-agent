# ============================================
# 主配置文件 - 仅包含公共配置和默认值
# ============================================

spring:
  application:
    name: hxx-travel-agent

  # 默认激活开发环境
  profiles:
    active: dev

  # Jackson 公共配置
  jackson:
    date-format: yyyy-MM-dd
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false

# ============================================
# MyBatis-Plus 框架配置
# ============================================
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hxx.travel.agent.trip.entity
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

# ============================================
# 公共日志格式（级别在各环境配置）
# ============================================
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
