# ============================================
# 开发环境配置 - 开箱即用，localhost 默认配置
# ============================================
spring:
  # 自动包含本地配置（覆盖敏感信息）
  profiles:
    include: local

  # 数据源（localhost 默认）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/hxx_travel_agent_dev?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

  # Redis（localhost 默认）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0

# MyBatis-Plus
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 服务端口
server:
  port: 8080

# 日志级别
logging:
  level:
    root: INFO
    com.hxx.travel.agent: DEBUG
